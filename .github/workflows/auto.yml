name: Update IPTV Playlist

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run script
        run: python update.py

      - name: Save playlist
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add my_playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update" && git push)

